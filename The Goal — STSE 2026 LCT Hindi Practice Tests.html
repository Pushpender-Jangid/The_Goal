<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Goal — STSE 2026 LCT Hindi Practice Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F3FA;
  --paper-2:#EBE6F5;
  --ink:#241934;
  --ink-soft:#665E77;
  --purple:#723FA3;
  --purple-deep:#5B2F86;
  --blue:#4DA4E0;
  --blue-deep:#3487C4;
  --green:#1F8A5F;
  --red:#C0392B;
  --line:#DBD3EA;
  --card:#FFFFFF;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191420; --paper-2:#221B2C; --ink:#EDE8F5; --ink-soft:#B3A9C4;
    --card:#231C2D; --line:#3B3049;
  }
}
:root[data-theme="dark"]{
  --paper:#191420; --paper-2:#221B2C; --ink:#EDE8F5; --ink-soft:#B3A9C4;
  --card:#231C2D; --line:#3B3049;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Poppins', 'Noto Sans Devanagari', system-ui, sans-serif;
  min-height:100%;
  line-height:1.5;
}
.wrap{max-width:880px; margin:0 auto; padding:24px 20px 60px;}
h1,h2,h3{font-family:'Poppins', sans-serif; margin:0 0 6px; font-weight:700;}
.hindi{font-family:'Noto Sans Devanagari', sans-serif;}
.masthead{
  display:flex; align-items:center; gap:14px; margin-bottom:24px;
  padding-bottom:16px; border-bottom:2px solid var(--line);
}
.masthead img{width:52px; height:52px; flex-shrink:0;}
.masthead .title{font-size:1.25rem; letter-spacing:.2px; font-weight:700; color:var(--purple);}
.masthead .sub{color:var(--ink-soft); font-size:.82rem; margin-top:2px;}
.badge{
  margin-left:auto; font-size:.72rem; color:#fff; background:var(--blue);
  padding:4px 11px; border-radius:20px; white-space:nowrap; font-weight:600;
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:6px;
  padding:20px 22px; margin-bottom:16px;
}
.field label{display:block; font-size:.82rem; color:var(--ink-soft); margin-bottom:6px;}
input[type=text]{
  width:100%; padding:11px 13px; font-size:1rem; font-family:inherit;
  border:1px solid var(--line); border-radius:5px; background:var(--paper);
  color:var(--ink);
}
input[type=text]:focus{outline:2px solid var(--purple); outline-offset:1px;}
button{font-family:inherit; cursor:pointer;}
.btn{
  background:var(--purple); color:#fff; border:none; border-radius:5px;
  padding:11px 20px; font-size:.95rem; font-weight:600;
}
.btn:hover{background:var(--purple-deep);}
.btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
.btn.ghost{background:transparent; color:var(--purple); border:1px solid var(--purple);}
.btn.ghost:hover{background:var(--purple); color:#fff;}
.paper-list{display:grid; gap:12px; margin-top:6px;}
.paper-row{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  border:1px solid var(--line); border-radius:6px; padding:14px 16px; background:var(--paper-2);
  flex-wrap:wrap;
}
.paper-row .pname{font-family:'Poppins', sans-serif; font-weight:600; font-size:1.05rem;}
.paper-row .pmeta{color:var(--ink-soft); font-size:.8rem; margin-top:2px;}
.pill{
  font-size:.72rem; padding:2px 8px; border-radius:20px; border:1px solid var(--green); color:var(--green);
}
.hidden{display:none !important;}
#test-header{
  display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  position:sticky; top:env(safe-area-inset-top, 0px); background:var(--paper);
  padding:10px 0; border-bottom:2px solid var(--ink); z-index:5;
}
#timer{font-variant-numeric:tabular-nums; font-weight:700; color:var(--purple); font-size:1.1rem;}
.palette{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 18px;}
.palette button{
  width:34px; height:34px; border-radius:4px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); font-size:.82rem; font-weight:600;
}
.palette button.answered{background:var(--green); color:#fff; border-color:var(--green);}
.passage-box{
  border-left:4px solid var(--blue); background:var(--paper-2); padding:14px 18px; margin-bottom:20px;
  font-family:'Poppins', sans-serif; font-size:1rem; line-height:1.8;
}
.qblock{border-bottom:1px solid var(--line); padding:18px 0;}
.qnum{color:var(--purple); font-weight:700; margin-right:6px;}
.qtext{font-size:1.02rem; margin-bottom:10px;}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border-radius:5px; margin-bottom:6px;
  border:1px solid transparent; cursor:pointer;
}
.opt:hover{background:var(--paper-2);}
.opt input{margin-top:3px;}
.opt.selected{border-color:var(--purple); background:var(--paper-2);}
.review .opt.correct-answer{border-color:var(--green); background:rgba(31,111,84,.12);}
.review .opt.wrong-selected{border-color:var(--red); background:rgba(192,57,43,.12);}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:18px 0;}
.stat{border:1px solid var(--line); border-radius:6px; padding:14px; text-align:center; background:var(--paper-2);}
.stat .num{font-family:'Poppins', sans-serif; font-size:1.7rem; font-weight:700;}
.stat .lab{font-size:.78rem; color:var(--ink-soft); margin-top:2px;}
.bar-row{display:flex; align-items:center; gap:10px; margin:6px 0; font-size:.88rem;}
.bar-row .name{width:170px; flex-shrink:0;}
.bar-track{flex:1; background:var(--paper-2); border-radius:20px; height:10px; overflow:hidden;}
.bar-fill{height:100%; background:var(--green); border-radius:20px;}
.bar-pct{width:64px; text-align:right; color:var(--ink-soft); flex-shrink:0;}
table.hist{width:100%; border-collapse:collapse; font-size:.88rem;}
table.hist th, table.hist td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
.footer-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;}
.tag-correct{color:var(--green); font-weight:600;}
.tag-wrong{color:var(--red); font-weight:600;}
.tag-skip{color:var(--ink-soft); font-weight:600;}
</style>
</head>

": "कर्ता", "C": "करण", "D": "सम्प्रदान"}, "ans": "A"}, {"n": 40, "q": "'संयुक्त वाक्य' का उदाहरण है:", "opts": {"A": "सूर्योदय हुआ और अंधकार दूर हो गया।", "B": "सूर्योदय होते ही अंधकार चला गया।", "C": "जो सूर्योदय हुआ वही अंधकार गया।", "D": "सूर्योदय पर अंधकार गया।"}, "ans": "A"}]}]</script>
<script>
const PAPERS = JSON.parse(document.getElementById('papers-data').textContent);
const PAPER_NAMES = ['Model Paper 1','Model Paper 2','Model Paper 3','Model Paper 4','Model Paper 5'];
const TOTAL_SECONDS = 45*60;

const TOPIC_RULES = [
  ['Sandhi', ['संधि']],
  ['Samas', ['समास']],
  ['Upsarg (Prefix)', ['उपसर्ग']],
  ['Pratyay (Suffix)', ['प्रत्यय']],
  ['Paryayvachi (Synonyms)', ['पर्यायवाची','पर्याय']],
  ['Vilom (Antonyms)', ['विलोम']],
  ['Muhavare & Lokoktiyan', ['मुहावर','लोकोक्ति']],
  ['Word Pairs / Anekarthi', ['युग्म','अनेकार्थी']],
  ['One-Word Substitution', ['एक शब्द']],
  ['Vartani (Spelling)', ['वर्तनी','शुद्ध शब्द','शुद्ध वर्तनी']],
  ['Karak (Case)', ['कारक']],
  ['Sentence Correction', ['वाक्य']],
  ['Sangya/Sarvanam/Visheshan/Kriya', ['संज्ञा','सर्वनाम','विशेषण','क्रिया','अव्यय','वाच्य']],
  ['Passage Comprehension', []],
];
function topicOf(q, idx){
  for(const [name, kws] of TOPIC_RULES){
    if(kws.length===0) continue;
    if(kws.some(k=>q.q.includes(k))) return name;
  }
  if(idx < 5) return 'Passage Comprehension';
  return 'General Grammar';
}

function safeGet(key){ try{ const v = localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function safeSet(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let state = { name:'', paperIdx:0, answers:{}, startTime:0, timerId:null, remaining:TOTAL_SECONDS };

const $ = sel => document.querySelector(sel);
const screens = { home: $('#screen-home'), test: $('#screen-test'), result: $('#screen-result') };
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
  window.scrollTo(0,0);
}

function renderHome(){
  const savedName = safeGet('stse_name');
  if(savedName) $('#uname').value = savedName;

  const list = $('#paper-list');
  list.innerHTML = '';
  PAPER_NAMES.forEach((pname, idx)=>{
    const attempts = safeGet('stse_history_'+idx) || [];
    const best = attempts.length ? Math.max(...attempts.map(a=>a.score)) : null;
    const row = document.createElement('div');
    row.className = 'paper-row';
    row.innerHTML = `
      <div>
        <div class="pname">${pname}</div>
        <div class="pmeta">40 Questions · 45 Minutes ${best!==null ? '· Best score: '+best+'/40' : '· Not attempted yet'}</div>
      </div>
      <button class="btn" data-idx="${idx}">Start Test</button>
    `;
    row.querySelector('button').addEventListener('click', ()=>startTest(idx));
    list.appendChild(row);
  });

  renderHistory();
}

function renderHistory(){
  let rows = [];
  for(let i=0;i<5;i++){
    const attempts = safeGet('stse_history_'+i) || [];
    attempts.forEach(a=> rows.push({paper:i, ...a}));
  }
  const card = $('#history-card');
  if(rows.length===0){ card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  rows.sort((a,b)=> b.ts - a.ts);
  const tbl = $('#hist-table');
  tbl.innerHTML = '<tr><th>Name</th><th>Paper</th><th>Score</th><th>Date</th></tr>' +
    rows.slice(0,10).map(r=>`<tr><td>${r.name}</td><td>${PAPER_NAMES[r.paper]}</td><td>${r.score}/40</td><td>${new Date(r.ts).toLocaleDateString('en-IN')}</td></tr>`).join('');
}

function startTest(idx){
  const name = $('#uname').value.trim();
  if(!name){ alert('Please enter your name first.'); $('#uname').focus(); return; }
  safeSet('stse_name', name);
  state = { name, paperIdx: idx, answers:{}, startTime: Date.now(), remaining: TOTAL_SECONDS };
  renderTest();
  showScreen('test');
  startTimer();
}

function renderTest(){
  const paper = PAPERS[state.paperIdx];
  $('#test-title').textContent = PAPER_NAMES[state.paperIdx];
  $('#test-sub').textContent = state.name + ' · 40 Questions';

  $('#passage-container').innerHTML = `<div class="passage-box"><strong>Passage (गद्यांश):</strong><br><span class="hindi">${paper.passage}</span></div>`;

  const pal = $('#palette');
  pal.innerHTML = '';
  paper.questions.forEach(q=>{
    const b = document.createElement('button');
    b.textContent = q.n;
    b.id = 'pal-'+q.n;
    b.addEventListener('click', ()=>{ document.getElementById('q-'+q.n).scrollIntoView({behavior:'smooth', block:'center'}); });
    pal.appendChild(b);
  });

  const qc = $('#questions');
  qc.innerHTML = '';
  paper.questions.forEach(q=>{
    const block = document.createElement('div');
    block.className = 'qblock';
    block.id = 'q-'+q.n;
    const optsHtml = ['A','B','C','D'].map(letter => `
      <label class="opt" data-letter="${letter}" data-qn="${q.n}">
        <input type="radio" name="q${q.n}" value="${letter}">
        <span class="hindi">${letter}) ${q.opts[letter]}</span>
      </label>`).join('');
    block.innerHTML = `<div class="qtext"><span class="qnum">Q${q.n}.</span><span class="hindi">${q.q}</span></div>${optsHtml}`;
    qc.appendChild(block);
  });

  qc.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const qn = opt.dataset.qn, letter = opt.dataset.letter;
      state.answers[qn] = letter;
      document.querySelectorAll(`.opt[data-qn="${qn}"]`).forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
      const pb = document.getElementById('pal-'+qn);
      if(pb) pb.classList.add('answered');
    });
  });
}

function startTimer(){
  clearInterval(state.timerId);
  updateTimerDisplay();
  state.timerId = setInterval(()=>{
    state.remaining--;
    updateTimerDisplay();
    if(state.remaining<=0){ clearInterval(state.timerId); finishTest(); }
  }, 1000);
}
function updateTimerDisplay(){
  const m = Math.max(0,Math.floor(state.remaining/60));
  const s = Math.max(0,state.remaining%60);
  $('#timer').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

$('#submit-btn').addEventListener('click', ()=>{
  const answered = Object.keys(state.answers).length;
  if(answered < 40){
    if(!confirm(`You have answered ${answered}/40 questions. The rest will be marked unanswered. Submit anyway?`)) return;
  }
  finishTest();
});
$('#exit-btn').addEventListener('click', ()=>{
  if(confirm('Are you sure you want to exit? Your progress will not be saved.')){
    clearInterval(state.timerId);
    showScreen('home');
    renderHome();
  }
});
$('#back-home-btn').addEventListener('click', ()=>{ showScreen('home'); renderHome(); });

function finishTest(){
  clearInterval(state.timerId);
  const paper = PAPERS[state.paperIdx];
  const timeTakenSec = TOTAL_SECONDS - state.remaining;

  let correct=0, wrong=0, skipped=0;
  const topicStats = {};
  const perQ = [];

  paper.questions.forEach((q, idx)=>{
    const given = state.answers[q.n];
    const isCorrect = given === q.ans;
    const topic = topicOf(q, idx);
    if(!topicStats[topic]) topicStats[topic] = {correct:0,total:0};
    topicStats[topic].total++;
    if(given===undefined){ skipped++; }
    else if(isCorrect){ correct++; topicStats[topic].correct++; }
    else { wrong++; }
    perQ.push({q, given, isCorrect});
  });

  const score = correct;
  const pct = Math.round((correct/40)*100);

  const history = safeGet('stse_history_'+state.paperIdx) || [];
  history.push({name:state.name, score, ts:Date.now(), timeTaken:timeTakenSec});
  safeSet('stse_history_'+state.paperIdx, history);

  renderResult({score, correct, wrong, skipped, pct, timeTakenSec, topicStats, perQ, paperIdx: state.paperIdx});
  showScreen('result');
}

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${m} min ${s} sec`;
}

function grade(pct){
  if(pct>=90) return 'Excellent — fully exam-ready';
  if(pct>=75) return 'Very good — a bit more practice will sharpen it further';
  if(pct>=60) return 'Good — focus on your weaker topics';
  if(pct>=40) return 'Below average — regular practice needed';
  return 'Needs improvement — revise core grammar concepts';
}

function renderResult(r){
  $('#res-title').textContent = state.name + ' — ' + PAPER_NAMES[r.paperIdx] + ' Result';
  $('#res-sub').textContent = `Time taken: ${fmtTime(r.timeTakenSec)} · ${grade(r.pct)}`;

  $('#stat-grid').innerHTML = `
    <div class="stat"><div class="num">${r.score}/40</div><div class="lab">Total Score</div></div>
    <div class="stat"><div class="num">${r.pct}%</div><div class="lab">Percentage</div></div>
    <div class="stat"><div class="num tag-correct">${r.correct}</div><div class="lab">Correct</div></div>
    <div class="stat"><div class="num tag-wrong">${r.wrong}</div><div class="lab">Wrong</div></div>
    <div class="stat"><div class="num tag-skip">${r.skipped}</div><div class="lab">Skipped</div></div>
  `;

  const topicKeys = Object.keys(r.topicStats).sort((a,b)=> (r.topicStats[a].correct/r.topicStats[a].total) - (r.topicStats[b].correct/r.topicStats[b].total));
  $('#topic-analysis').innerHTML = topicKeys.map(t=>{
    const s = r.topicStats[t];
    const pct = Math.round((s.correct/s.total)*100);
    return `<div class="bar-row">
      <div class="name">${t} (${s.correct}/${s.total})</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${pct<50?'var(--red)':'var(--green)'}"></div></div>
      <div class="bar-pct">${pct}%</div>
    </div>`;
  }).join('');

  $('#review-list').innerHTML = r.perQ.map(({q,given,isCorrect})=>{
    const statusTag = given===undefined ? '<span class="tag-skip">Skipped</span>' : (isCorrect ? '<span class="tag-correct">Correct</span>' : '<span class="tag-wrong">Wrong</span>');
    const optsHtml = ['A','B','C','D'].map(letter=>{
      let cls='opt';
      if(letter===q.ans) cls+=' correct-answer';
      else if(letter===given && !isCorrect) cls+=' wrong-selected';
      return `<div class="${cls}"><span class="hindi">${letter}) ${q.opts[letter]}</span></div>`;
    }).join('');
    return `<div class="qblock">
      <div class="qtext"><span class="qnum">Q${q.n}.</span><span class="hindi">${q.q}</span> &nbsp;${statusTag}</div>
      ${optsHtml}
    </div>`;
  }).join('');
}

renderHome();
</script>
</body>
</html>
